<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eliteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:0.6" />
    </linearGradient>
    <filter id="premiumShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#accentGlow)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Main premium background -->
  <circle cx="256" cy="256" r="210" fill="url(#eliteGradient)" filter="url(#premiumShadow)"/>
  
  <!-- Hexagon frame for modern tech aesthetic -->
  <path d="M 256 120 L 320 160 L 320 272 L 256 312 L 192 272 L 192 160 Z" 
        fill="none" 
        stroke="white" 
        stroke-width="1" 
        opacity="0.15"
        stroke-linejoin="round"/>
  
  <!-- Central MSS monogram with premium spacing -->
  <text x="256" y="270" 
        font-family="'Montserrat', 'SF Pro Display', 'Segoe UI', sans-serif" 
        font-size="95" 
        font-weight="700" 
        fill="white" 
        text-anchor="middle" 
        letter-spacing="4"
        filter="url(#glow)">MSS</text>
  
  <!-- Professional divider with gradient -->
  <line x1="210" y1="290" x2="302" y2="290" 
        stroke="url(#accentGlow)" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.6"/>
  
  <!-- Refined tagline -->
  <text x="256" y="315" 
        font-family="'Montserrat', 'SF Pro Display', 'Segoe UI', sans-serif" 
        font-size="14" 
        font-weight="500" 
        fill="white" 
        text-anchor="middle" 
        letter-spacing="5"
        opacity="0.8">SOFTWARE ENGINEER</text>
  
  <!-- Elegant code brackets - minimal and refined -->
  <g opacity="0.25">
    <path d="M 145 230 L 130 256 L 145 282" 
          stroke="white" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 367 230 L 382 256 L 367 282" 
          stroke="white" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative dots for balance -->
  <circle cx="256" cy="340" r="2" fill="white" opacity="0.4"/>
  
  <!-- Corner markers - ultra subtle -->
  <g opacity="0.12">
    <rect x="165" y="165" width="16" height="1.5" fill="white" rx="0.75"/>
    <rect x="165" y="165" width="1.5" height="16" fill="white" rx="0.75"/>
    <rect x="331" y="165" width="16" height="1.5" fill="white" rx="0.75"/>
    <rect x="345.5" y="165" width="1.5" height="16" fill="white" rx="0.75"/>
    <rect x="165" y="345.5" width="16" height="1.5" fill="white" rx="0.75"/>
    <rect x="165" y="331" width="1.5" height="16" fill="white" rx="0.75"/>
    <rect x="331" y="345.5" width="16" height="1.5" fill="white" rx="0.75"/>
    <rect x="345.5" y="331" width="1.5" height="16" fill="white" rx="0.75"/>
  </g>
  
  <!-- Micro accent lines for premium feel -->
  <g opacity="0.2">
    <line x1="240" y1="360" x2="272" y2="360" stroke="white" stroke-width="0.5" stroke-linecap="round"/>
  </g>
</svg>